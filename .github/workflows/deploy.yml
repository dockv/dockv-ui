# 在 PR 中对 main 做构建验证，推送 main 时构建并部署 VitePress 文档站到 GitHub Pages
name: Build & Deploy

on:
  # 推送到 main 时运行（构建 + 部署）
  push:
    branches: [main]
  # 面向 main 的 PR 时运行（仅构建检查，确保合并前通过）
  pull_request:
    branches: [main]

  # 允许你从 Actions 选项卡手动运行此工作流程
  workflow_dispatch:

# 最小权限：仅读取代码、写 Pages、签发生成页面所需令牌
permissions:
  contents: read
  pages: write
  id-token: write

# 移除了全局串行 concurrency：若在这里设置并发组，PR 的 build 会被排队拖慢。
# 并发控制改为只落在 deploy job 上（见下方），让 PR 检查 build 并行执行。

jobs:
  # 构建工作：PR 与 main 都会触发；build 不做并发限制，多个 PR 可并行检查
  build:
    runs-on: ubuntu-latest
    # 超时保护：避免构建无限挂起（默认无限制），超过 20 分钟强制终止
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # 安装并用缓存加速 pnpm（版本与本地一致为 11）
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      # 安装并缓存 Node 24（上述弃用警告源，确保运行时最新）
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # 构建全部产物：组件 JS/样式/类型声明 + 文档站 + Storybook
      - name: Build All (Components, Docs, Storybook)
        run: pnpm build:all
      # 仅上传文档站产物，后续由 deploy job 发布到 GitHub Pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  # 部署工作（仅推送到 main 时执行；PR 只做构建检查，不部署）
  deploy:
    if: github.event_name == 'push'
    # 只允许同一分支同时进行一次部署：跳过正在进行与最新队列之间的旧运行，
    # 但不取消正在进行的运行，让已开始的部署正常完成；group 带上分支名，不同分支互不阻塞
    concurrency:
      group: pages-${{ github.ref }}
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # 依赖 build 成功后才部署，保证「先构建、后发布」的时序
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
