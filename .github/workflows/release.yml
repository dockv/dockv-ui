# 正式版 Release 流程：仅由手动打的 v* tag 触发（版本=tag，CI 不加后缀）
# 预览版产物由 deploy.yml 在 push main 时更新（见该文件 preview step）
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # 创建 Release 及上传 assets 所需

concurrency:
  # 同一 tag 只允许串行发布，避免并发创建 Release 冲突
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # 超时保护：避免发布流程无限挂起，默认无限制
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 需要完整历史用于收集本次 tag 之后的 commit

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.11.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 仅构建组件库（JS + 样式 + 类型声明），无需文档站/Storybook
      - name: Build components
        run: pnpm build

      # 打包 dist 目录各产物为一个 zip，便于作为单一 Release asset 下载
      - name: Package dist
        run: |
          mkdir -p release-assets
          zip -r "release-assets/dockv-ui-${GITHUB_REF_NAME:-latest}.zip" dist

      # 保留一份到 Actions artifact，供不装 git 的开发者直接从运行页下载
      - name: Upload dist artifact
        uses: actions/upload-artifact@v6
        with:
          name: dockv-ui-dist
          path: dist
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"

          # 标记是否为预览版（含 -pre/-beta/-alpha/-rc 等 SemVer 预发布后缀），是则标 prerelease
          PRERELEASE_FLAG=""
          if [[ "${TAG}" =~ - ]] || [[ "${TAG}" =~ \.RC?[0-9] ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # 累计起点：当前 tag 之前最近的版本号 tag，与 deploy.yml 的 preview 计算方式一致。
          # 不能用 gh release list 取"第二个 Release"：列表混有固定的 preview Release，
          # 起点会被取成 preview 指向的旧 commit，导致 notes 整段错位、缺本次版本的提交。
          # HEAD 已 checkout 到当前 tag，故 --merged HEAD 即"不晚于当前版本"的全部 tag。
          PREV_TAG="$(git tag --merged HEAD --list 'v*' --sort=-v:refname | grep -vx "${TAG}" | head -n 1 || true)"
          if [ -n "${PREV_TAG}" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE=""
          fi
          echo "release notes 比较区间：${RANGE:-<全部历史>}"

          # 提交信息形如「<emoji> <type>: <subject>」（如「✨ feat: 新增 Tag 标签组件」），
          # 不能直接用 --grep="^feat"，因为行首是 emoji；改为先取全部标题再按类型过滤。
          commit_lines() {
            git log ${RANGE} --pretty=format:"- %s（%h）" 2>/dev/null || true
            echo
          }

          section() {
            commit_lines | grep -E "^[-] .* $1: " || true
          }

          tidy() {
            sed -e '/^[[:space:]]*$/d'
          }

          # 按 Angular commit 风格分类；未命中类型的提交（ci/build/style/test/revert、merge 记录等）
          # 统一归入"其他改动"，不与上面分类重复
          {
            echo "# ${TAG}"
            echo
            echo "## ✨ 新功能 (feat)"
            section feat | tidy
            echo
            echo "## 🐛 修复 (fix)"
            section fix | tidy
            echo
            echo "## 📃 文档 (docs)"
            section docs | tidy
            echo
            echo "## 🎈 性能优化 (perf)"
            section perf | tidy
            echo
            echo "## 🦄 重构 (refactor)"
            section refactor | tidy
            echo
            echo "## ✨ 其他改动"
            commit_lines | grep -Ev "^[-] .* (feat|fix|docs|perf|refactor): " | tidy || true
            echo
          } > release-notes.md

          # 创建正式版 Release，assets 与仓库自动生成的源码包一同附加
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file release-notes.md \
            ${PRERELEASE_FLAG} \
            "release-assets/dockv-ui-${GITHUB_REF_NAME:-latest}.zip"
